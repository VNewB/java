services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: my-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql
      - ../database/database.sql:/database.sql:ro

volumes:
  sqlserver-data:
